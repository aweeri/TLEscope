version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "extremelywip"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    target-branch: "extremelywip"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
