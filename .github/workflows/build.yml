name: Build and Release TLEscope

on:
  workflow_dispatch:
  push:
    branches: ["extremelywip"]
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - "ROADMAP.md"
      - "CONTRIBUTING.md"

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Get raylib commit
        id: raylib
        run: git -C lib/raylib rev-parse HEAD

      # raylib's `raylib` target depends on its .o files, so restoring only
      # libraylib.a would force a full rebuild anyway. Cache the whole build
      # output (objects + archive) to skip it on cache hits.
      - name: Cache raylib build output
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: lib/raylib/src
          key: raylib-linux-x64-${{ steps.raylib.outputs.commit }}
          restore-keys: |
            raylib-linux-x64-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ make \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev libcurl4-openssl-dev

      - name: Build and bundle
        run: make -j"$(nproc)" linux

      - name: Verify architecture
        run: |
          file dist/TLEscope-Linux-Portable/TLEscope
          file dist/TLEscope-Linux-Portable/TLEscope | grep -Eiq 'x86-64|x86_64'

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TLEscope-Linux-Portable
          path: dist/TLEscope-Linux-Portable/
          retention-days: 14
          if-no-files-found: error

  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Get raylib commit
        id: raylib
        run: git -C lib/raylib rev-parse HEAD

      - name: Cache raylib build output
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: lib/raylib/src
          key: raylib-linux-arm64-${{ steps.raylib.outputs.commit }}
          restore-keys: |
            raylib-linux-arm64-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ make \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev libcurl4-openssl-dev

      - name: Build and bundle
        run: make -j"$(nproc)" linux DIST_LINUX=dist/TLEscope-Linux-arm64-Portable

      - name: Verify architecture
        run: |
          file dist/TLEscope-Linux-arm64-Portable/TLEscope
          file dist/TLEscope-Linux-arm64-Portable/TLEscope | grep -Eiq 'aarch64|arm64'

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TLEscope-Linux-arm64-Portable
          path: dist/TLEscope-Linux-arm64-Portable/
          retention-days: 14
          if-no-files-found: error

  build-macos:
    name: Build macOS ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel
            runner: macos-15-intel
            expect: x86_64
            artifact: TLEscope-macOS-Intel-App
            archive: TLEscope-macOS-Intel.app.zip
          - name: Apple-Silicon
            runner: macos-15
            expect: arm64
            artifact: TLEscope-macOS-arm64-App
            archive: TLEscope-macOS-arm64.app.zip
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Get raylib commit
        id: raylib
        run: git -C lib/raylib rev-parse HEAD

      - name: Cache raylib build output
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: lib/raylib/src
          key: raylib-macos-${{ matrix.name }}-${{ steps.raylib.outputs.commit }}
          restore-keys: |
            raylib-macos-${{ matrix.name }}-

      - name: Build portable application
        run: make macos

      - name: Build app bundle
        run: |
          ./macos_bundle.sh
          test -x dist/TLEscope.app/Contents/MacOS/TLEscope
          test -x dist/TLEscope.app/Contents/MacOS/TLEscope.bin
          test -f dist/TLEscope.app/Contents/Resources/themes/default/theme.json
          test -f dist/TLEscope.app/Contents/Resources/themes/default/font.ttf
          plutil -lint dist/TLEscope.app/Contents/Info.plist

      - name: Verify architecture
        run: |
          file dist/TLEscope.app/Contents/MacOS/TLEscope.bin
          file dist/TLEscope.app/Contents/MacOS/TLEscope.bin | grep -q "${{ matrix.expect }}"

      - name: Package app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/TLEscope.app \
            "dist/${{ matrix.archive }}"
          unzip -l "dist/${{ matrix.archive }}" | grep -q "TLEscope.app/Contents/Resources/themes/default/font.ttf"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.archive }}
          retention-days: 14
          if-no-files-found: error

  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            make
            git
            file
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-ngtcp2
            mingw-w64-x86_64-nghttp3
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-libssh2
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-brotli
            mingw-w64-x86_64-libpsl
            mingw-w64-x86_64-libidn2
            mingw-w64-x86_64-libunistring
            mingw-w64-x86_64-libiconv
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-nsis
            mingw-w64-x86_64-imagemagick

      - name: Get raylib commit
        id: raylib
        shell: msys2 {0}
        run: git -C lib/raylib rev-parse HEAD

      - name: Cache raylib build output
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: lib/raylib/src
          key: raylib-win-x64-${{ steps.raylib.outputs.commit }}
          restore-keys: |
            raylib-win-x64-

      - name: Build portable application and installer
        run: make win-installer MINGW_PREFIX=/mingw64

      - name: Verify architecture and runtime dependencies
        run: |
          file dist/TLEscope-Win-Portable/TLEscope.exe
          file dist/TLEscope-Win-Portable/TLEscope.exe | grep -Eiq 'x86-64|x86_64'
          objdump -p dist/TLEscope-Win-Portable/TLEscope.exe | grep 'DLL Name'
          if objdump -p dist/TLEscope-Win-Portable/TLEscope.exe | grep -Eiq 'libwinpthread|libstdc\+\+|libgcc|libc\+\+|libunwind'; then
            echo "TLEscope.exe depends on an unbundled compiler runtime DLL." >&2
            exit 1
          fi

      - name: Upload portable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TLEscope-Win-Portable
          path: dist/TLEscope-Win-Portable/
          retention-days: 14
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TLEscope-Installer
          path: dist/TLEscope-Installer.exe
          retention-days: 14
          if-no-files-found: error

  build-windows-arm64:
    # TEMPORARILY DISABLED.
    if: false
    name: Build Windows ARM64
    runs-on: windows-11-arm
    timeout-minutes: 25
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: CLANGARM64
          update: true
          cache: true
          install: >-
            make
            git
            file
            mingw-w64-clang-aarch64-make
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-llvm
            mingw-w64-clang-aarch64-curl
            mingw-w64-clang-aarch64-ngtcp2
            mingw-w64-clang-aarch64-nghttp3
            mingw-w64-clang-aarch64-zstd
            mingw-w64-clang-aarch64-libssh2
            mingw-w64-clang-aarch64-openssl
            mingw-w64-clang-aarch64-brotli
            mingw-w64-clang-aarch64-libpsl
            mingw-w64-clang-aarch64-libidn2
            mingw-w64-clang-aarch64-libunistring
            mingw-w64-clang-aarch64-libiconv
            mingw-w64-clang-aarch64-pkgconf

      - name: Get raylib commit
        id: raylib
        run: git -C lib/raylib rev-parse HEAD

      - name: Cache raylib build output
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: lib/raylib/src
          key: raylib-win-arm64-${{ steps.raylib.outputs.commit }}
          restore-keys: |
            raylib-win-arm64-

      - name: Build and bundle
        run: |
          make windows-arm64 \
            MINGW_PREFIX=/clangarm64 \
            CLANG64_PREFIX=/clangarm64 \
            RAYLIB_MAKE_ARGS="CC=clang AR=llvm-ar"

      - name: Verify architecture and runtime dependencies
        run: |
          file dist/TLEscope-Win-arm64-Portable/TLEscope.exe
          file dist/TLEscope-Win-arm64-Portable/TLEscope.exe | grep -Eiq 'aarch64|arm64'
          llvm-objdump -p dist/TLEscope-Win-arm64-Portable/TLEscope.exe | grep 'DLL Name'
          if llvm-objdump -p dist/TLEscope-Win-arm64-Portable/TLEscope.exe | grep -Eiq 'libwinpthread|libstdc\+\+|libgcc|libc\+\+|libunwind'; then
            echo "TLEscope.exe depends on an unbundled compiler runtime DLL." >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TLEscope-Win-arm64-Portable
          path: dist/TLEscope-Win-arm64-Portable/
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - build-linux
      - build-linux-arm64
      - build-macos
      - build-windows
    if: github.event_name == 'push' && (github.ref == 'refs/heads/extremelywip' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Prepare release archives
        run: |
          set -euo pipefail
          cd artifacts

          chmod +x TLEscope-Linux-Portable/TLEscope
          chmod +x TLEscope-Linux-arm64-Portable/TLEscope

          for artifact in \
            TLEscope-Linux-Portable \
            TLEscope-Linux-arm64-Portable \
            TLEscope-Win-Portable
          do
            zip -r "../${artifact}.zip" "${artifact}/"
          done

          mv TLEscope-macOS-Intel-App/TLEscope-macOS-Intel.app.zip ../
          mv TLEscope-macOS-arm64-App/TLEscope-macOS-arm64.app.zip ../
          mv TLEscope-Installer/TLEscope-Installer.exe ../

      - name: Update nightly tag
        if: github.ref == 'refs/heads/extremelywip'
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly

      - name: Update nightly release
        if: github.ref == 'refs/heads/extremelywip'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: Nightly Build
          body: Automated nightly build reflecting the latest commit on `extremelywip`.
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            TLEscope-Linux-Portable.zip
            TLEscope-Linux-arm64-Portable.zip
            TLEscope-macOS-Intel.app.zip
            TLEscope-macOS-arm64.app.zip
            TLEscope-Win-Portable.zip
            TLEscope-Installer.exe

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            TLEscope-Linux-Portable.zip
            TLEscope-Linux-arm64-Portable.zip
            TLEscope-macOS-Intel.app.zip
            TLEscope-macOS-arm64.app.zip
            TLEscope-Win-Portable.zip
            TLEscope-Installer.exe
